<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Update prices</title>
<style>
:root{--grape:#3b2149;--gold:#e3a72f;--paper:#f4f3ec;--ink:#1e1a22;--card:#fff;--line:#d9d6c7;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{--paper:#17121c;--ink:#f2eef5;--card:#241b2d;--line:#3a2d46}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--grape);color:#fff;padding:18px 16px;font-weight:800;font-size:1.3rem}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;background:#cfc;flex:none;display:grid;place-items:center;font-size:2rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
label{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
input[type=text],input[type=number],input[type=password]{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.price{display:flex;align-items:center;gap:8px}.price span{font-weight:800;font-size:1.3rem}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 18px;cursor:pointer}
.photo{background:var(--gold);color:#2a1a00;padding:10px 14px;font-size:.95rem}
.del{background:transparent;color:var(--red);border:2px solid var(--red);padding:8px 12px;font-size:.9rem}
.add{width:100%;background:transparent;border:3px dashed var(--grape);color:var(--grape);padding:18px}
@media (prefers-color-scheme:dark){.add{color:#e9dcf0;border-color:#e9dcf0}}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px}
.save{width:100%;max-width:608px;display:block;margin:auto;background:#1fa855;color:#fff;font-size:1.2rem}
.save:disabled{opacity:.5}
.msg{text-align:center;font-weight:700;margin:0 0 8px;min-height:1.4em}
.err{color:var(--red)}
.hint{font-size:.9rem;opacity:.75}
input[type=file]{display:none}
</style>
</head>
<body>
<header>Update prices and photos</header>
<main id="app"></main>
<div class="bar" id="bar" hidden><p class="msg" id="msg"></p><button class="save" id="save">Save changes</button></div>
<script>
const OWNER='veereshr4446', REPO='Shop-Dryfruits', BR='main';
const api=p=>`https://api.github.com/repos/${OWNER}/${REPO}/contents/${p}`;
let token=localStorage.getItem('shop_token')||'', data=null, sha=null, removed=[];
const $=id=>document.getElementById(id), app=$('app');
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const msg=(t,e)=>{$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')};
async function gh(path,method='GET',body){
  const url=api(path)+(method==='GET'?`?ref=${BR}&t=${Date.now()}`:'');
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e;}
  return r.json();
}
function setup(note){
  $('bar').hidden=true;
  app.innerHTML=`<div class="card"><b>First time setup</b><p class="hint">${note||'Paste the access code once. This phone will remember it.'}</p>
  <label for="tk">Access code</label><input id="tk" type="password" autocomplete="off"><br><br><button class="photo" id="go">Continue</button></div>`;
  $('go').onclick=()=>{token=$('tk').value.trim();localStorage.setItem('shop_token',token);load();};
}
async function load(){
  if(!token) return setup();
  app.innerHTML='<p>Loading...</p>';
  try{
    const f=await gh('products.json'); sha=f.sha;
    data=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,'')))));
    removed=[]; render();
  }catch(e){
    if(e.status===401||e.status===403||e.status===404){localStorage.removeItem('shop_token');token='';setup('That code did not work. Ask for a new one.');}
    else app.innerHTML='<p class="err">Could not load. Check internet and refresh.</p>';
  }
}
function render(){
  $('bar').hidden=false; msg('');
  app.innerHTML='';
  data.items.forEach((it,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="row"><div class="thumb">${(it.newImage||it.image)?'':'🍇'}</div><div style="flex:1"><label style="margin-top:0">Name</label><input type="text" value=""></div></div>
    <label>Price per ${it.unit||'kg'}</label><div class="price"><span>₹</span><input type="number" inputmode="decimal" min="0"></div>
    <div class="row" style="margin-top:12px;justify-content:space-between"><label class="photo" style="margin:0;border-radius:12px;cursor:pointer">Change photo<input type="file" accept="image/*"></label><button class="del">Delete</button></div>`;
    const th=c.querySelector('.thumb'),src=it.newImage||it.image;
    if(src){const im=document.createElement('img');im.src=it.newImage||(it.image+'?t='+Date.now());th.appendChild(im);}
    const [nm,pr]=c.querySelectorAll('input[type=text],input[type=number]');
    nm.value=it.name;pr.value=it.price;
    nm.oninput=()=>it.name=nm.value; pr.oninput=()=>it.price=Number(pr.value);
    c.querySelector('input[type=file]').onchange=async e=>{if(e.target.files[0]){it.newImage=await shrink(e.target.files[0]);render();}};
    c.querySelector('.del').onclick=()=>{if(confirm('Delete '+it.name+'?')){if(it.image)removed.push(it.image);data.items.splice(i,1);render();}};
    app.appendChild(c);
  });
  const add=document.createElement('button');add.className='add';add.textContent='+ Add new item';
  add.onclick=()=>{data.items.push({id:'i'+Date.now(),name:'Kishmish',price:0,unit:'kg',image:''});render();window.scrollTo(0,document.body.scrollHeight)};
  app.appendChild(add);
}
function shrink(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));URL.revokeObjectURL(u);};im.src=u;});}
$('save').onclick=async()=>{
  const b=$('save');b.disabled=true;msg('Saving... please wait');
  try{
    for(const it of data.items){
      if(it.newImage){
        const path='images/'+it.id+'-'+Date.now()+'.jpg';
        await gh(path,'PUT',{message:'Add photo',branch:BR,content:it.newImage.split(',')[1]});
        if(it.image)removed.push(it.image);
        it.image=path;
      }
    }
    const out={shop:data.shop,updated:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),items:data.items.map(({id,name,price,unit,image})=>({id,name,price,unit,image}))};
    await gh('products.json','PUT',{message:'Update prices',branch:BR,sha,content:b64(JSON.stringify(out,null,2))});
    for(const p of removed){try{const f=await gh(p);await gh(p,'DELETE',{message:'Remove photo',branch:BR,sha:f.sha});}catch(e){}}
    msg('Saved! The website updates in about 1 minute.');
    await load(); msg('Saved! The website updates in about 1 minute.');
  }catch(e){msg('Could not save ('+e.message+'). Try again.',true);}
  b.disabled=false;
};
load();
</script>
</body>
</html>
