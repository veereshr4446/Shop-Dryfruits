<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Update prices</title>
<style>
:root{--grape:#4a2a14;--gold:#e3a72f;--paper:#f4f3ec;--ink:#1e1a22;--card:#fff;--line:#d9d6c7;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{--paper:#1a120b;--ink:#f2eef5;--card:#2a1c11;--line:#4a3220}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--grape);color:#fff;padding:18px 16px;font-weight:800;font-size:1.3rem}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;background:#cfc;flex:none;display:grid;place-items:center;font-size:2rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
label{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
input[type=text],input[type=number],input[type=password]{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.price{display:flex;align-items:center;gap:8px}.price span{font-weight:800;font-size:1.3rem}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 18px;cursor:pointer}
.photo{background:var(--gold);color:#2a1a00;padding:10px 14px;font-size:.95rem}
.del{background:transparent;color:var(--red);border:2px solid var(--red);padding:8px 12px;font-size:.9rem}
.add{width:100%;background:transparent;border:3px dashed var(--grape);color:var(--grape);padding:18px}
@media (prefers-color-scheme:dark){.add{color:#e9dcf0;border-color:#e9dcf0}}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px}
.save{width:100%;max-width:608px;display:block;margin:auto;background:#1fa855;color:#fff;font-size:1.2rem}
.save:disabled{opacity:.5}
.msg{text-align:center;font-weight:700;margin:0 0 8px;min-height:1.4em}
.err{color:var(--red)}
.hint{font-size:.9rem;opacity:.75}
input[type=file]{display:none}

.done{position:fixed;inset:0;background:#1fa855;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:50;text-align:center;padding:24px}
.done.show{display:flex}
.done .ring{width:150px;height:150px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.done circle{fill:#fff;stroke:none}
.done .tick{fill:none;stroke:#1fa855;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .35s ease forwards}
.done h2{font-size:2.4rem;margin:14px 0 0;font-weight:800}
.done p{margin:0;font-size:1.1rem;opacity:.95}
.done .t{font-size:.95rem;opacity:.85}
.done .btns{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.done a,.done button{background:#fff;color:#12703a;font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 22px;text-decoration:none;cursor:pointer}
.done button{background:transparent;color:#fff;border:2px solid #fff}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.done .ring{animation:none}.done .tick{animation:none;stroke-dashoffset:0}}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.strip.none{opacity:.7;font-size:.95rem}
.st{position:relative;flex:none;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#cfc}
.st img{width:100%;height:100%;object-fit:cover;display:block}
.st button{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;padding:0;background:rgba(0,0,0,.7);color:#fff;font-size:1.2rem;line-height:1}
.st video{width:100%;height:100%;object-fit:cover;display:block}
.vb{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px}
.sr{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sr .st{width:92px;height:64px}
.sr input[type=text]{padding:8px 10px;font-size:.95rem}
.mini{padding:6px 10px;font-size:1rem;background:var(--line);color:var(--ink);border-radius:8px}
.mini:disabled{opacity:.35}
.ctl{display:flex;flex-direction:column;gap:6px;flex:none}
</style>
<script type="module">import {upload} from "https://esm.sh/@vercel/blob@2/client";window.blobUpload=upload;</script>
<link rel="manifest" href="/admin/manifest.json">
<meta name="theme-color" content="#4a2a14">
<link rel="apple-touch-icon" href="/icons/admin-192.png">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register("/sw.js");</script>
</head>
<body>
<header>Update prices, photos and videos</header>
<main id="app"></main>
<div class="bar" id="bar" hidden><p class="msg" id="msg"></p><button class="save" id="save">Save changes</button></div>
<div class="done" id="done" role="status" aria-live="polite">
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48"/><path class="tick" d="M28 52 L44 67 L73 35"/></svg>
  <h2>Done</h2>
  <p>Prices, photos and videos updated</p>
  <p class="t" id="dtime"></p>
  <div class="btns"><a href="/" target="_blank" rel="noopener">View website</a><button id="dok">OK</button></div>
</div>
<script>
const $=id=>document.getElementById(id), app=$('app');
let data=null, removed=[];
const msg=(t,e)=>{$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')};
async function call(body){
  const r=await fetch('/api/admin',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j.error||('Error '+r.status));e.status=r.status;throw e;}
  return j;
}
function login(note){
  $('bar').hidden=true;
  app.innerHTML=`<div class="card"><b>Enter password</b><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p class="msg err" id="pe">${note||''}</p><button class="photo" id="go">Open</button><p class="hint">You only need to do this once on this phone.</p></div>`;
  const go=async()=>{$('pe').textContent='Checking...';
    try{await call({action:'login',password:$('pw').value});load();}
    catch(e){$('pe').textContent=e.status===401?'Wrong password. Try again.':e.message;}};
  $('go').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go();};
}
async function load(){
  app.innerHTML='<p>Loading...</p>';
  try{data=await (await fetch('/api/products?t='+Date.now())).json();data.slides=data.slides||[];removed=[];render();}
  catch(e){app.innerHTML='<p class="err">Could not load. Check internet and refresh.</p>';}
}
const isVid=u=>/\.(mp4|webm|mov|m4v)(\?|$)/i.test(String(u));
const MB=n=>(n/1048576).toFixed(1), rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const extOf=t=>t==='video/webm'?'.webm':t==='video/quicktime'?'.mov':'.mp4';
function shrinkImg(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Could not read that photo'));};
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>{if(b&&b.size>1.2e6)return c.toBlob(b2=>res(b2||b),'image/jpeg',.7);res(b);},'image/jpeg',q||.82);};
  im.src=u;});}
// Reads length and grabs one still frame (used as the slide's cover picture).
function videoInfo(file){return new Promise(res=>{const v=document.createElement('video'),u=URL.createObjectURL(file);let done=false;
  const fin=o=>{if(done)return;done=true;URL.revokeObjectURL(u);res(o);};
  v.muted=true;v.playsInline=true;v.preload='metadata';
  v.onerror=()=>fin({duration:0,poster:null,bad:true});
  v.onloadedmetadata=()=>{try{v.currentTime=Math.min(.3,(v.duration||0)/2);}catch(e){}};
  v.onseeked=()=>{const d=v.duration,k=Math.min(1,1000/Math.max(v.videoWidth||1,v.videoHeight||1)),c=document.createElement('canvas');
    c.width=Math.round((v.videoWidth||640)*k);c.height=Math.round((v.videoHeight||360)*k);
    try{c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>fin({duration:d,poster:b}),'image/jpeg',.8);}catch(e){fin({duration:d,poster:null});}};
  setTimeout(()=>fin({duration:v.duration||0,poster:null}),8000);v.src=u;});}
// Makes any phone video fit the free plan: first 10 seconds, tall 4:5, no sound, about 1 MB. Runs inside the browser in real time.
const VMAX=10;
function recVideo(file,prog){return new Promise((res,rej)=>{
  const W=540,H=675,u=URL.createObjectURL(file),v=document.createElement('video');
  const mime=window.MediaRecorder&&['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime||!HTMLCanvasElement.prototype.captureStream){URL.revokeObjectURL(u);return rej(new Error('NOREC'));}
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  let rec,chunks=[],poster=null,done=false,guard;
  const fail=m=>{if(done)return;done=true;clearTimeout(guard);try{rec&&rec.state!=='inactive'&&rec.stop();}catch(e){}v.pause();URL.revokeObjectURL(u);rej(new Error(m));};
  v.onerror=()=>fail('This video cannot be read.');
  const draw=()=>{
    const sw=v.videoWidth,sh=v.videoHeight;let cw=sw,ch=sh,cx=0,cy=0;
    if(sw/sh>W/H){cw=sh*W/H;cx=(sw-cw)/2;}else{ch=sw*H/W;cy=(sh-ch)/2;}
    g.drawImage(v,cx,cy,cw,ch,0,0,W,H);
  };
  v.onloadeddata=()=>{
    const len=Math.min(VMAX,isFinite(v.duration)&&v.duration>0?v.duration:VMAX);
    try{rec=new MediaRecorder(c.captureStream(30),{mimeType:mime,videoBitsPerSecond:800000});}catch(e){return fail('NOREC');}
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=()=>{if(done)return;done=true;clearTimeout(guard);v.pause();URL.revokeObjectURL(u);
      const out=new Blob(chunks,{type:mime.split(';')[0]});
      poster?res({blob:out,poster}):c.toBlob(b=>res({blob:out,poster:b}),'image/jpeg',.8);};
    rec.onerror=()=>fail('Could not shrink this video.');
    const tick=()=>{
      if(done)return;
      draw();
      if(!poster&&v.currentTime>.4)c.toBlob(b=>{if(b)poster=b;},'image/jpeg',.8);
      prog&&prog(Math.min(v.currentTime,len),len);
      if(v.ended||v.currentTime>=len){if(rec.state!=='inactive')rec.stop();return;}
      requestAnimationFrame(tick);
    };
    v.play().then(()=>{rec.start(500);tick();}).catch(()=>fail('Could not play this video to shrink it.'));
  };
  guard=setTimeout(()=>fail('Took too long. Try a shorter video.'),90000);
});}
// Checks a picked video, shrinks it when needed. Returns {ok,blob,poster} or {msg}.
async function prepVideo(f){
  if(f.size>400*1048576)return{msg:'That video is '+MB(f.size)+' MB, too big. Pick a shorter one.'};
  const i=await videoInfo(f);
  if(i.bad)return{msg:'This video cannot be read.\nTip: send it to yourself on WhatsApp first, then pick it from there.'};
  if(i.duration<=VMAX+.5&&f.size<=2.5*1048576)return{ok:true,blob:f,poster:i.poster}; // already short and small
  try{
    const r=await recVideo(f,(t,l)=>msg('Shrinking video... '+Math.floor(t)+' of '+Math.floor(l)+' s. Keep this page open.'));
    if(r.blob.size>4*1048576)return{msg:'Still '+MB(r.blob.size)+' MB after shrinking. Please pick a simpler or shorter video.'};
    return{ok:true,blob:r.blob,poster:r.poster||i.poster};
  }catch(e){
    if(e.message!=='NOREC')return{msg:e.message};
    // Older browser that cannot shrink: only accept videos that already fit.
    if(i.duration>VMAX+.5)return{msg:'That video is '+Math.round(i.duration)+' seconds. Maximum is 10 seconds. Please trim it, or open this page in Chrome to trim automatically.'};
    if(f.size>4*1048576)return{msg:'That video is '+MB(f.size)+' MB. Maximum is 4 MB. Send it to yourself on WhatsApp first to shrink it.'};
    return{ok:true,blob:f,poster:i.poster};
  }
}
async function checkVideo(f,maxSec){maxSec=maxSec||20;
  if(f.size>10*1048576)return{msg:'That video is '+MB(f.size)+' MB. Maximum is 10 MB.\nTip: send it to yourself on WhatsApp first (it shrinks it), then pick it from there.'};
  const i=await videoInfo(f);
  if(i.bad)return{msg:'This video cannot be read.\nTip: send it to yourself on WhatsApp first, then pick it from there.'};
  if(i.duration>maxSec+.5)return{msg:'That video is '+Math.round(i.duration)+' seconds. Maximum is '+maxSec+' seconds. Please trim it.'};
  return{ok:true,poster:i.poster};
}
function mediaEl(src,vid,poster){
  if(vid&&!poster){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';v.src=src+'#t=0.1';return v;}
  const im=document.createElement('img');im.src=vid?poster:src;im.alt='';return im;
}
const xbtn=(label,fn)=>{const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',label);x.onclick=fn;return x;};

function slidesCard(){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<b>Slideshow</b> <span class="hint">(moves by itself, above the products)</span><p class="hint" style="margin:6px 0 10px">One slide = one video or one photo (for example one company). Up to 12 slides, 10 of them videos. Videos are cut to 10 seconds and shrunk automatically (takes about as long as the video). Best look: tall (portrait).</p><div class="sl"></div><div class="row" style="margin-top:8px"><label class="photo" style="margin:0;border-radius:12px;cursor:pointer">+ Add image<input type="file" accept="image/*" multiple id="si"></label><label class="photo" style="margin:0;border-radius:12px;cursor:pointer">+ Add video<input type="file" accept="video/*" multiple id="sv"></label></div>';
  const list=c.querySelector('.sl'),L=data.slides;
  if(!L.length)list.innerHTML='<p class="hint">No slides yet.</p>';
  L.forEach((sl,i)=>{
    const r=document.createElement('div');r.className='sr';
    const t=document.createElement('div');t.className='st';
    const vid=sl.type==='video';
    t.appendChild(sl.blob?(sl.preview?mediaEl(sl.preview,false):document.createTextNode('🎬')):mediaEl(sl.url,vid,sl.poster));
    if(vid){const vb=document.createElement('span');vb.className='vb';vb.textContent='▶ Video';t.appendChild(vb);}
    const cap=document.createElement('input');cap.type='text';cap.maxLength=60;cap.placeholder='Caption (optional)';cap.value=sl.caption||'';cap.setAttribute('aria-label','Caption');cap.oninput=()=>sl.caption=cap.value;
    const ctl=document.createElement('div');ctl.className='ctl';
    const mk=(txt,lab,dis,fn)=>{const b=document.createElement('button');b.type='button';b.className='mini';b.textContent=txt;b.setAttribute('aria-label',lab);b.disabled=dis;b.onclick=fn;return b;};
    const mv=d=>()=>{const j=i+d;[L[i],L[j]]=[L[j],L[i]];render();};
    ctl.append(mk('◀','Move earlier',i===0,mv(-1)),mk('▶','Move later',i===L.length-1,mv(1)),mk('✕','Delete slide',false,()=>{if(!confirm('Delete this slide?'))return;if(sl.url)removed.push(sl.url);if(sl.poster)removed.push(sl.poster);L.splice(i,1);render();}));
    r.append(t,cap,ctl);list.appendChild(r);
  });
  c.querySelector('#si').onchange=async e=>{
    const files=[...e.target.files];e.target.value='';
    for(const f of files){
      if(L.length>=12){alert('Only 12 slides. Extra images were skipped.');break;}
      try{msg('Preparing image...');const b=await shrinkImg(f,1350,.82);L.push({id:'s'+rid(),type:'image',caption:'',blob:b,preview:URL.createObjectURL(b)});}
      catch(err){alert(err.message);}
    }
    render();
  };
  c.querySelector('#sv').onchange=async e=>{
    const files=[...e.target.files];e.target.value='';
    for(const f of files){
      if(L.length>=12){alert('Only 12 slides. Extra videos were skipped.');break;}
      if(L.filter(x=>x.type==='video').length>=10){alert('Only 10 video slides. Videos use the most free data. Delete one first.');break;}
      msg('Checking video...');const r=await prepVideo(f);
      if(!r.ok){msg('');alert(r.msg);continue;}
      L.push({id:'s'+rid(),type:'video',caption:'',blob:r.blob,posterBlob:r.poster,preview:r.poster?URL.createObjectURL(r.poster):''});
    }
    render();
  };
  return c;
}

function render(){
  $('bar').hidden=false; msg('');
  app.innerHTML='';
  data.shop=data.shop||{};data.slides=data.slides||[];
  const sc=document.createElement('div');sc.className='card';
  sc.innerHTML='<label style="margin-top:0" for="sn">Shop heading</label><input id="sn" type="text" maxlength="80"><label for="st">Small line under heading</label><input id="st" type="text" maxlength="120"><label for="sw">WhatsApp number for orders (10 digits)</label><input id="sw" type="tel" inputmode="numeric" maxlength="15">';
  const sn=sc.querySelector('#sn'),st=sc.querySelector('#st');
  const sw=sc.querySelector('#sw');
  sn.value=data.shop.name||'';st.value=data.shop.tagline||'';
  let w=String(data.shop.whatsapp||'').replace(/\D/g,'');if(w.length===12&&w.startsWith('91'))w=w.slice(2);sw.value=/X/i.test(String(data.shop.whatsapp||''))?'':w;
  sw.oninput=()=>data.shop.whatsapp=sw.value;
  sn.oninput=()=>data.shop.name=sn.value;st.oninput=()=>data.shop.tagline=st.value;
  app.appendChild(sc);
  app.appendChild(slidesCard());
  data.items.forEach((it,i)=>{
    it.images=it.images||(it.image?[it.image]:[]);it.pending=it.pending||[];
    const total=()=>it.images.length+it.pending.length;
    const nvid=()=>it.images.filter(isVid).length+it.pending.filter(p=>p.type==='video').length;
    const c=document.createElement('div');c.className='card';
    const left=it.ts?Math.max(1,Math.ceil((it.ts+6048e5-Date.now())/864e5)):7;
    c.innerHTML=`<p style="margin:0 0 8px;font-size:.85rem;opacity:.75">⏳ Auto-removes in ${left} day${left>1?'s':''}. Change price or photos and save to keep it 7 more days.</p><label style="margin-top:0">Name</label><input type="text">
    <label>Photos and videos (${total()} of 6)</label><div class="strip"></div>
    <label>Price per ${it.unit||'kg'}</label><div class="price"><span>₹</span><input type="number" inputmode="decimal" min="0"></div>
    <div class="row" style="margin-top:12px;justify-content:space-between;flex-wrap:wrap"><label class="photo" style="margin:0;border-radius:12px;cursor:pointer">+ Add photos / videos<input type="file" accept="image/*,video/*" multiple></label><button class="del">Delete item</button></div>
    <p class="hint" style="margin:8px 0 0">Up to 4 files per item, only 1 of them a video (cut to 10 seconds and shrunk automatically).</p>`;
    const strip=c.querySelector('.strip');
    const thumb=(el,vid,onx)=>{const t=document.createElement('div');t.className='st';t.appendChild(el);if(vid){const vb=document.createElement('span');vb.className='vb';vb.textContent='▶ Video';t.appendChild(vb);}t.appendChild(xbtn('Remove',onx));strip.appendChild(t);};
    it.images.forEach((u,k)=>thumb(mediaEl(u,isVid(u)),isVid(u),()=>{removed.push(u);it.images.splice(k,1);render();}));
    it.pending.forEach((pd,k)=>thumb(pd.preview?mediaEl(pd.preview,false):document.createTextNode('🎬'),pd.type==='video',()=>{it.pending.splice(k,1);render();}));
    if(!total()){strip.className='strip none';strip.textContent='🍇 No photos yet';}
    const [nm,pr]=c.querySelectorAll('input[type=text],input[type=number]');
    nm.value=it.name;pr.value=it.price;
    nm.oninput=()=>it.name=nm.value; pr.oninput=()=>it.price=Number(pr.value);
    c.querySelector('input[type=file]').onchange=async e=>{
      const files=[...e.target.files];e.target.value='';
      for(const f of files){
        if(total()>=4){alert('Only 4 per item. Extra files were skipped.');break;}
        try{
          if(f.type.startsWith('video/')||isVid(f.name)){
            if(nvid()>=1){alert('Only 1 video per item.');continue;}
            msg('Checking video...');const r=await prepVideo(f);
            if(!r.ok){msg('');alert(r.msg);continue;}
            it.pending.push({type:'video',blob:r.blob,preview:r.poster?URL.createObjectURL(r.poster):''});
          }else{
            msg('Preparing photo...');const b=await shrinkImg(f,1200,.82);
            it.pending.push({type:'image',blob:b,preview:URL.createObjectURL(b)});
          }
        }catch(err){alert(err.message);}
      }
      render();
    };
    c.querySelector('.del').onclick=()=>{if(confirm('Delete '+it.name+'?')){it.images.forEach(u=>removed.push(u));data.items.splice(i,1);render();}};
    app.appendChild(c);
  });
  const add=document.createElement('button');add.className='add';add.textContent='+ Add new item';
  add.onclick=()=>{data.items.push({id:'i'+Date.now(),name:'Kishmish',price:0,unit:'kg',images:[],pending:[]});render();window.scrollTo(0,document.body.scrollHeight)};
  app.appendChild(add);
  const uc=document.createElement('div');uc.className='card';uc.style.marginTop='14px';
  uc.innerHTML='<b>Free storage check</b><p class="hint" id="un" style="margin:6px 0 10px">The free Vercel plan has 1 GB of storage. Tap to see how much is used.</p><button type="button" class="photo" id="ub">Check storage</button>';
  uc.querySelector('#ub').onclick=async()=>{const un=uc.querySelector('#un');un.className='hint';un.textContent='Checking...';
    try{const r=await call({action:'usage'}),mb=r.bytes/1048576,pc=Math.round(mb/1024*100);
      un.textContent=mb.toFixed(0)+' MB of 1024 MB used ('+pc+'%), '+r.count+' files. '+(pc>70?'Getting full. Delete old slides or items.':'All good.');if(pc>70)un.className='hint err';}
    catch(e){un.textContent='Could not check ('+e.message+')';un.className='hint err';}};
  app.appendChild(uc);
}
const b64=blob=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]);f.onerror=rej;f.readAsDataURL(blob);});
async function up(path,blob,type,onp){
  try{
    if(!window.blobUpload)throw new Error('Upload tool did not load. Check internet and refresh.');
    return (await window.blobUpload(path,blob,{access:'public',handleUploadUrl:'/api/upload',contentType:type,onUploadProgress:onp})).url;
  }catch(e){
    // Safety net: photos can still go through the old route if the direct upload fails.
    if(type==='image/jpeg'&&blob.size<3200000&&!/log in/i.test(e.message)){
      return (await call({action:'image',name:path.split('/').pop(),content:await b64(blob)})).url;
    }
    throw e;
  }
}
function showDone(){
  $('dtime').textContent=new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  $('done').classList.add('show');
  try{navigator.vibrate&&navigator.vibrate([60,40,60]);}catch(e){}
  $('dok').focus();
}
$('dok').onclick=()=>{$('done').classList.remove('show');window.scrollTo(0,0);};
$('save').onclick=async()=>{
  const b=$('save');b.disabled=true;
  const total=data.slides.reduce((n,x)=>n+(x.blob?1:0)+(x.posterBlob?1:0),0)+data.items.reduce((n,it)=>n+(it.pending||[]).length,0);
  let n=0;
  const prog=l=>p=>msg('Uploading '+n+' of '+total+(p&&p.percentage<100?' ('+Math.round(p.percentage)+'%)':'')+' '+l);
  msg(total?'Uploading... please wait':'Saving... please wait');
  try{
    for(const sl of data.slides){
      if(sl.blob){n++;const vid=sl.type==='video';
        sl.url=await up('slides/'+sl.id+(vid?extOf(sl.blob.type):'.jpg'),sl.blob,vid?(sl.blob.type||'video/mp4'):'image/jpeg',prog('(slide)'));
        delete sl.blob;}
      if(sl.posterBlob){n++;sl.poster=await up('slides/'+sl.id+'-p.jpg',sl.posterBlob,'image/jpeg',prog('(slide)'));delete sl.posterBlob;}
      delete sl.preview;
    }
    for(const it of data.items){
      while(it.pending&&it.pending.length){
        const pd=it.pending[0],vid=pd.type==='video';n++;
        const path=(vid?'videos/':'images/')+String(it.id).replace(/[^\w-]/g,'').slice(0,20)+'-'+rid()+(vid?extOf(pd.blob.type):'.jpg');
        it.images.push(await up(path,pd.blob,vid?(pd.blob.type||'video/mp4'):'image/jpeg',prog('')));
        it.pending.shift();
      }
    }
    msg('Saving... please wait');
    await call({action:'save',shop:{name:(data.shop||{}).name,tagline:(data.shop||{}).tagline,whatsapp:(data.shop||{}).whatsapp},slides:data.slides.map(({id,url,type,caption,poster})=>({id,url,type,caption,poster})),items:data.items.map(({id,name,price,unit,images})=>({id,name,price,unit,images})),removed});
    removed=[];render();msg('Saved! The website is updated.');showDone();
  }catch(e){
    if(e.status===401||/log in/i.test(e.message)){login('Please enter the password again.');}
    else msg('Could not save ('+e.message+'). Try again.',true);
  }
  b.disabled=false;
};
call({action:'check'}).then(load).catch(()=>login());
