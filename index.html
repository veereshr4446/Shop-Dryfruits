<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kishmish Shop</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--grape:#3b2149;--gold:#e3a72f;--leaf:#6f8a1f;--paper:#fafaf5;--ink:#1e1a22;--card:#fff;--line:#e6e3d6}
:root[data-theme=dark]{--paper:#17121c;--ink:#f2eef5;--card:#241b2d;--line:#3a2d46;color-scheme:dark}
.theme{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.theme:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:relative;background:var(--grape);color:#fff;padding:36px 20px 44px;text-align:center}
h1{font:800 clamp(2.2rem,8vw,3.6rem)/1.05 "Baloo 2",system-ui,sans-serif;margin:0}
header p{margin:8px 0 0;color:#e9dcf0}
.upd{display:inline-block;margin-top:16px;background:var(--gold);color:#2a1a00;font-weight:700;padding:6px 14px;border-radius:99px;font-size:.9rem}
main{max-width:1000px;margin:0 auto;padding:24px 16px 100px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:linear-gradient(135deg,#d8c46a,#9bb04a);display:grid;place-items:center;font-size:3rem}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:700}
.price{font:800 1.7rem "Baloo 2",system-ui,sans-serif;color:var(--leaf)}
.price small{font-size:.9rem;font-weight:600;color:inherit;opacity:.8}
.order{margin-top:auto;display:block;text-align:center;background:var(--grape);color:#fff;text-decoration:none;font-weight:700;padding:11px;border-radius:10px}
.order:focus-visible,.fab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{text-align:center;padding:60px 0;opacity:.7}
.fab{position:fixed;left:16px;right:16px;bottom:16px;max-width:520px;margin:auto;background:#1fa855;color:#fff;text-align:center;font-weight:800;padding:14px;border-radius:14px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header>
  <button class="theme" id="theme" type="button" aria-label="Switch dark or light mode"></button>
  <h1 id="shop">Kishmish Shop</h1>
  <p id="tag"></p>
  <span class="upd" id="upd" hidden></span>
</header>
<main>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>
<a class="fab" id="wa" href="#" hidden>Order on WhatsApp</a>
<script>
(()=>{
  const r=document.documentElement,b=document.getElementById('theme');
  const paint=()=>{const d=r.dataset.theme==='dark';b.textContent=d?'☀️':'🌙';b.title=d?'Light mode':'Dark mode';};
  b.onclick=()=>{r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}paint();};
  paint();
})();
(async()=>{
  const $=id=>document.getElementById(id);
  let d;
  try{ try{ d=await (await fetch('/api/products?t='+Date.now())).json(); if(!d.items) throw 0; }catch(_){ d=await (await fetch('products.json?t='+Date.now())).json(); } }
  catch(e){ $('grid').innerHTML='<p class="empty">Prices will be here soon.</p>'; return; }
  const s=d.shop||{};
  $('shop').textContent=s.name||'Kishmish Shop'; document.title=s.name||'Kishmish Shop';
  $('tag').textContent=s.tagline||'';
  if(d.updated){ $('upd').hidden=false; $('upd').textContent='Prices updated '+d.updated; }
  const num=(s.whatsapp||'').replace(/\D/g,'');
  const link=t=>num&&!/X/i.test(s.whatsapp)?'https://wa.me/'+num+'?text='+encodeURIComponent(t):'';
  if(link('Hello')){ $('wa').hidden=false; $('wa').href=link('Hello, I want to order kishmish.'); }
  const items=d.items||[];
  if(!items.length){ $('grid').innerHTML='<p class="empty">No items today. Please check back soon.</p>'; return; }
  $('grid').innerHTML='';
  for(const it of items){
    const c=document.createElement('article'); c.className='card';
    const ph=document.createElement('div'); ph.className='ph';
    if(it.image){ const im=document.createElement('img'); im.src=it.image+'?t='+(d.updated||''); im.alt=it.name; im.loading='lazy'; ph.appendChild(im); } else ph.textContent='🍇';
    const info=document.createElement('div'); info.className='info';
    const n=document.createElement('div'); n.className='name'; n.textContent=it.name;
    const p=document.createElement('div'); p.className='price'; p.textContent='₹'+it.price+' ';
    const u=document.createElement('small'); u.textContent='/ '+(it.unit||'kg'); p.appendChild(u);
    info.append(n,p);
    const l=link('Hello, I want to order '+it.name+' (₹'+it.price+'/'+(it.unit||'kg')+').');
    if(l){ const a=document.createElement('a'); a.className='order'; a.href=l; a.textContent='Order this'; info.appendChild(a); }
    c.append(ph,info); $('grid').appendChild(c);
  }
})();
</script>
</body>
</html>
