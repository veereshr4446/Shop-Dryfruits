<style>
:root{--wood:#4a2a14;--wood2:#6b3f1f;--gold:#f2c14e;--leaf:#2f7a24;--leafd:#1f4d22;--cream:#fbf3d6;
  --paper:#fbf6e6;--ink:#2b1c10;--card:#fffdf6;--line:#e8dcb8;--price:#2f7a24}
:root[data-theme=dark]{--paper:#1a120b;--ink:#f6ecd2;--card:#2a1c11;--line:#4a3220;--price:#9ad46a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--wood2) 0%,var(--wood) 100%);color:var(--cream);padding:9px 12px;border-bottom:2px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.28)}
.contacts{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1000px;margin:0 auto}
.ct{display:flex;align-items:center;gap:8px;color:var(--cream);text-decoration:none;min-width:0;white-space:nowrap}
.ct.r{flex-direction:row-reverse;text-align:right;margin-left:auto}
.ct .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff6b6b,#e11d1d 60%,#9b0f0f);box-shadow:0 0 0 2px rgba(225,29,29,.35)}
.ct.r .ic{color:#fff;background:linear-gradient(135deg,#5fd35f,#2f9e2f 60%,#1b6b1b);box-shadow:0 0 0 2px rgba(47,158,47,.35)}
.ct .ic svg{width:15px;height:15px}
.ct .tx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.ct small{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;opacity:.95}
.ct .chip{align-self:flex-end;margin-bottom:4px;font-size:.56rem;letter-spacing:.04em;text-transform:uppercase;color:#3a2400;font-weight:800;padding:2px 7px;border-radius:99px;background:linear-gradient(135deg,#f6d66b,var(--gold) 60%,#c98f12);box-shadow:0 0 10px rgba(242,193,78,.45);white-space:nowrap}
.ct:not(.r) .chip{align-self:flex-start}
@media (max-width:340px){.ct .chip{font-size:.5rem;padding:2px 5px;letter-spacing:.02em}}
.ct b{font-size:clamp(.95rem,4.3vw,1.1rem);font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums;color:#fff}
.ct:focus-visible,.theme:focus-visible,.order:focus-visible,.fab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.theme{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--cream);font-size:1.15rem;cursor:pointer;display:grid;place-items:center}

h1{font:800 clamp(1.5rem,5.5vw,2.2rem)/1.15 "Baloo 2",system-ui,sans-serif;margin:0;color:var(--wood)}

main{max-width:1000px;margin:0 auto;padding:18px 16px 100px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#e6c85e,#8fae4a)}

.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px;pointer-events:none}

.dots i.on{background:#fff;transform:scale(1.25)}
.cnt{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:99px}

.share{flex:none;width:48px;border-radius:10px;border:2px solid var(--gold);background:var(--card);color:var(--price);cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s}
.share:active{background:var(--gold);color:#3a2400}
.share:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{text-align:center;padding:60px 0;opacity:.7}
.fab{position:fixed;left:16px;right:16px;bottom:16px;max-width:520px;margin:auto;background:#1fa855;color:#fff;text-align:center;font-weight:800;padding:14px;border-radius:14px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.any{display:flex;align-items:center;gap:10px;margin:0 auto;padding:9px 12px;background:linear-gradient(180deg,var(--wood2) 0%,var(--wood) 100%);color:var(--cream);text-decoration:none;border-top:1px solid rgba(242,193,78,.35);border-bottom:2px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.28)}
.any[hidden]{display:none}
.any>*{max-width:1000px}
.any .tick{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1rem;font-weight:900;background:linear-gradient(135deg,#ff6b6b,#e11d1d 60%,#9b0f0f);box-shadow:0 0 0 2px rgba(225,29,29,.35);animation:pulse 2s infinite}
.any .tick svg{width:15px;height:15px}
.any .ok{display:inline-block;margin-left:8px;vertical-align:-.2em;line-height:0}
.any .ok svg{width:1.3em;height:1.3em;display:block;filter:drop-shadow(0 0 5px rgba(225,29,29,.55))}
.any .tx{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.any small{align-self:flex-start;display:flex;flex-wrap:nowrap;align-items:center;gap:5px;margin-bottom:4px;max-width:100%}
.any small span{font-size:.56rem;letter-spacing:.04em;text-transform:uppercase;color:#3a2400;font-weight:800;padding:2px 7px;border-radius:99px;background:linear-gradient(135deg,#f6d66b,var(--gold) 60%,#c98f12);box-shadow:0 0 10px rgba(242,193,78,.45);white-space:nowrap}
.any small .dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(242,193,78,.7)}
@media (max-width:340px){.any small span{font-size:.5rem;padding:2px 5px;letter-spacing:.02em}.any .go{padding:7px 10px}}
.any b{font-size:clamp(.95rem,4.3vw,1.1rem);font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums;color:#fff}
.any .nm{font-size:.8rem;color:var(--cream);opacity:.9}
.any .go{flex:none;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem;color:#fff;padding:7px 14px;border-radius:99px;background:linear-gradient(135deg,#ff6b6b,#e11d1d 60%,#9b0f0f)}
.any .go svg{width:15px;height:15px}
.any:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,29,.65)}70%{box-shadow:0 0 0 9px rgba(225,29,29,0)}100%{box-shadow:0 0 0 0 rgba(225,29,29,0)}}
@media (prefers-reduced-motion:reduce){.any .tick{animation:none}}
.hero{max-width:1000px;margin:6px auto 0}
.hero[hidden]{display:none}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:10px 14px 6px;scroll-padding-inline:14px;position:relative;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hs:focus-visible{outline:3px solid var(--gold);outline-offset:-3px;border-radius:18px}
.hslide{flex:0 0 min(calc(100% - 32px),680px);aspect-ratio:4/5;border-radius:18px;overflow:hidden;position:relative;scroll-snap-align:start;background:linear-gradient(135deg,#6b3f1f,#2b1c10);box-shadow:0 8px 22px rgba(60,35,10,.22)}
.hslide img,.hslide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hslide .cap{position:absolute;left:0;right:0;bottom:0;padding:36px 16px 14px;color:#fff;font:800 clamp(1.05rem,4.2vw,1.45rem)/1.2 "Baloo 2",system-ui,sans-serif;background:linear-gradient(0deg,rgba(0,0,0,.62),transparent);text-shadow:0 1px 6px rgba(0,0,0,.5)}
@media (min-width:600px){.hslide{aspect-ratio:16/10}}
.hdots{display:flex;justify-content:center;gap:6px;padding:8px 0 2px}
.hdots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .35s ease;overflow:hidden;position:relative;cursor:pointer}
.hdots i.on{width:28px}
.hdots i.on::after{content:"";position:absolute;inset:0;background:var(--price);transform-origin:left;transform:scaleX(0);animation:hfill var(--d,4.5s) linear forwards}
.hdots.paused i.on::after{animation-play-state:paused}
@keyframes hfill{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.hdots i.on::after{animation:none;transform:scaleX(1)}}
.slides video{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block;background:#2b1c10}

<script>
(()=>{
  const r=document.documentElement,b=document.getElementById('theme');
  const paint=()=>{const d=r.dataset.theme==='dark';b.textContent=d?'☀️':'🌙';b.title=d?'Light mode':'Dark mode';};
  b.onclick=()=>{r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}paint();};
  paint();
})();
const SAVE=!!(navigator.connection&&navigator.connection.saveData), REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
const isVid=u=>/\.(mp4|webm|mov|m4v)(\?|$)/i.test(String(u));
// Product videos: load only when mostly on screen, play muted, pause when scrolled away (saves data).
const vio='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(en=>{
  const v=en.target;
  if(en.isIntersecting&&en.intersectionRatio>=.6){
    if(!v.src){v.preload='metadata';v.src=v.dataset.src;}
    if(SAVE||REDUCE){v.controls=true;return;}
    const p=v.play();if(p&&p.catch)p.catch(()=>{});
  }else v.pause();
}),{threshold:[0,.6]}):null;
function addVideo(parent,url,label){
  const v=document.createElement('video');
  v.muted=true;v.defaultMuted=true;v.playsInline=true;v.loop=true;v.preload='none';
  v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('aria-label',label);
  v.dataset.src=url;parent.appendChild(v);
  if(vio)vio.observe(v);else{v.src=url;v.controls=true;}
  return v;
}
// Slideshow: swipe cards, auto-advance (4.5 s for photos, video length up to 15 s), pauses on touch/hover/off-screen.
function heroInit(slides){
  const hero=document.getElementById('hero'),hs=document.getElementById('hs'),dots=document.getElementById('hdots');
  slides=(slides||[]).filter(x=>x&&x.url).slice(0,12);
  if(!slides.length)return;
  const IMG_MS=5000,VID_MAX=10000,els=[];
  slides.forEach((sl,i)=>{
    const f=document.createElement('div');f.className='hslide';f.setAttribute('role','group');f.setAttribute('aria-label',(i+1)+' of '+slides.length);
    let m;
    if(sl.type==='video'||isVid(sl.url)){
      m=document.createElement('video');m.muted=true;m.defaultMuted=true;m.playsInline=true;m.loop=false;m.preload='none';
      m.setAttribute('muted','');m.setAttribute('playsinline','');m.setAttribute('aria-label',sl.caption||'Video');
      if(sl.poster)m.poster=sl.poster;
      f.appendChild(m);els.push({f,m,v:true,src:sl.url});
    }else{
      m=document.createElement('img');m.alt=sl.caption||'';m.decoding='async';m.loading=i<2?'eager':'lazy';m.src=sl.url;
      f.appendChild(m);els.push({f,m,v:false});
    }
    if(sl.caption){const c=document.createElement('div');c.className='cap';c.textContent=sl.caption;f.appendChild(c);}
    hs.appendChild(f);
    const d=document.createElement('i');d.onclick=()=>{go(i);poke();};dots.appendChild(d);
  });
  hero.hidden=false;
  const dl=[...dots.children];
  let cur=0,timer=null,hold=false,idleT=null,visible=false,lock=0;
  const clear=()=>{clearTimeout(timer);timer=null;};
  const auto=()=>els.length>1&&!REDUCE&&visible&&!document.hidden&&!hold;
  const pauseVids=()=>els.forEach(e=>{if(e.v)e.m.pause();});
  const setDot=(i,ms)=>{
    dl.forEach(d=>d.classList.remove('on'));void dots.offsetWidth;
    dl[i].style.setProperty('--d',ms+'ms');dl[i].classList.add('on');
  };
  const next=()=>{if(auto())go((cur+1)%els.length);};
  const runVideo=i=>{
    const e=els[i],v=e.m;let done=false;
    const fin=()=>{if(done)return;done=true;if(cur===i)next();};
    if(SAVE||REDUCE){setDot(i,IMG_MS);timer=setTimeout(fin,IMG_MS);return;} // data saver: poster only
    const start=()=>{
      if(cur!==i)return;
      const ms=Math.min(v.duration&&isFinite(v.duration)?v.duration*1000:10000,VID_MAX);
      setDot(i,ms);
      try{v.currentTime=0;}catch(_){}
      const p=v.play();if(p&&p.catch)p.catch(()=>{});
      timer=setTimeout(fin,ms+400);
    };
    v.onended=fin;
    if(!v.src){v.preload='auto';v.src=e.src;}
    if(v.readyState>=1)start();
    else{
      v.addEventListener('loadedmetadata',start,{once:true});
      v.addEventListener('error',()=>{if(cur===i){setDot(i,IMG_MS);timer=setTimeout(fin,IMG_MS);}},{once:true});
      v.load();
    }
  };
  const warm=i=>{const nx=els[(i+1)%els.length];if(nx&&nx.v&&!nx.m.src&&!SAVE&&!REDUCE){nx.m.preload='auto';nx.m.src=nx.src;}}; // get the next clip ready so it starts at once
  const activate=i=>{
    clear();cur=i;pauseVids();warm(i);
    if(els[i].v)runVideo(i);
    else{setDot(i,IMG_MS);if(auto())timer=setTimeout(next,IMG_MS);}
  };
  const go=i=>{
    lock=Date.now()+800;
    hs.scrollTo({left:els[i].f.offsetLeft-14,behavior:REDUCE?'auto':'smooth'});
    activate(i);
  };
  const poke=()=>{
    hold=true;clear();dots.classList.add('paused');clearTimeout(idleT);
    idleT=setTimeout(()=>{hold=false;dots.classList.remove('paused');if(visible)activate(cur);},5000);
  };
  ['touchstart','pointerdown','wheel','keydown','focusin'].forEach(n=>hs.addEventListener(n,poke,{passive:true}));
  hs.addEventListener('mouseenter',()=>{hold=true;clear();dots.classList.add('paused');clearTimeout(idleT);});
  hs.addEventListener('mouseleave',()=>{clearTimeout(idleT);idleT=setTimeout(()=>{hold=false;dots.classList.remove('paused');if(visible)activate(cur);},1200);});
  let st=null;
  hs.addEventListener('scroll',()=>{
    clearTimeout(st);
    st=setTimeout(()=>{
      if(Date.now()<lock)return;
      let k=0,best=1e9;els.forEach((e,j)=>{const d=Math.abs(e.f.offsetLeft-14-hs.scrollLeft);if(d<best){best=d;k=j;}});
      if(k!==cur)activate(k);
    },110);
  },{passive:true});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){clear();pauseVids();}
    else if(!hold&&visible)activate(cur);
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(es=>{
      visible=es[0].isIntersecting;
      if(!visible){clear();pauseVids();}
      else if(!hold)activate(cur);
    },{threshold:.35}).observe(hero);
  }else{visible=true;activate(0);}
}
(async()=>{
  const $=id=>document.getElementById(id);
  let d;
  try{ try{ d=await (await fetch('/api/products')).json(); if(!d.items) throw 0; }catch(_){ d=await (await fetch('products.json?t='+Date.now())).json(); } }
  catch(e){ $('grid').innerHTML='<p class="msg">Prices will be here soon.</p>'; return; }
  const s=d.shop||{};
  try{heroInit(d.slides);}catch(e){}
  $('shop').textContent=s.name||'Kissan Cold Storage'; document.title=s.name||'Kissan Cold Storage';
  $('tag').textContent=s.tagline||'';
  if(d.updated){ $('upd').hidden=false; $('upd').textContent='Prices updated '+d.updated; }
  const PH='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg>';
  const cs=(s.contacts||[]).filter(c=>String(c.phone||'').replace(/\D/g,'')).sort((x,y)=>(/owner/i.test(y.role||'')?1:0)-(/owner/i.test(x.role||'')?1:0));
  cs.forEach((c,i)=>{
    const ph=String(c.phone).replace(/\D/g,'');
    const a=document.createElement('a'); a.className='ct'+(i>0?' r':''); a.href='tel:+91'+ph.slice(-10);
    a.setAttribute('aria-label','Call '+c.name+(c.role?' ('+c.role+')':''));
    const ic=document.createElement('span'); ic.className='ic'; ic.innerHTML=PH;
    const tx=document.createElement('span'); tx.className='tx';
    const sm=document.createElement('small'); sm.textContent=(c.role?c.role+' · ':'')+c.name;
    const n=document.createElement('b'); n.textContent=ph.slice(-10);
    if(/seller/i.test(c.role||'')){const ch=document.createElement('span'); ch.className='chip'; ch.textContent='Call anytime for orders'; tx.appendChild(ch);}
    if(/owner/i.test(c.role||'')){const ch=document.createElement('span'); ch.className='chip'; ch.textContent='Owner'; tx.appendChild(ch);}
    tx.append(sm,n);
    a.append(ic,tx); $('contacts').appendChild(a);
  });
  if(s.anytime&&String(s.anytime.phone||'').replace(/\D/g,'').length>=10){
    const ap=String(s.anytime.phone).replace(/\D/g,'').slice(-10), a=$('any');
    a.href='tel:+91'+ap; a.hidden=false;
    a.setAttribute('aria-label','Call '+(s.anytime.name||'us')+' for bills and payments on '+ap);
    const t=document.createElement('span'); t.className='tick'; t.innerHTML=PH; t.setAttribute('aria-hidden','true');
    const tx=document.createElement('span'); tx.className='tx';
    const sm=document.createElement('small'); ['Owner','Bills and payments'].forEach((w,k)=>{if(k){const d=document.createElement('i'); d.className='dot'; sm.appendChild(d);} const c=document.createElement('span'); c.textContent=w; sm.appendChild(c);});
    const n=document.createElement('b'); const ok=document.createElement('span'); ok.className='ok'; ok.setAttribute('aria-hidden','true'); ok.innerHTML='<svg viewBox="0 0 24 24"><defs><linearGradient id="okg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".6" stop-color="#e11d1d"/><stop offset="1" stop-color="#9b0f0f"/></linearGradient></defs><circle cx="12" cy="12" r="11" fill="url(#okg)"/><path d="M6.5 12.5l3.8 3.8 7.2-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; n.append('+91 '+ap.slice(0,5)+' '+ap.slice(5),ok);
    tx.append(sm,n);
    if(s.anytime.name){const nm=document.createElement('span'); nm.className='nm'; nm.textContent=s.anytime.name; tx.appendChild(nm);}
    const go=document.createElement('span'); go.className='go'; go.innerHTML=PH+'Call';
    a.append(t,tx,go);
  }
  const num=(s.whatsapp||'').replace(/\D/g,'');
  const link=t=>num&&!/X/i.test(s.whatsapp)?'https://wa.me/'+num+'?text='+encodeURIComponent(t):'';
  if(link('Hello')){ $('wa').hidden=false; $('wa').href=link('Hello, I want to order kishmish.'); }
  const items=d.items||[];
  if(!items.length){ $('grid').innerHTML='<p class="msg">No items today. Please check back soon.</p>'; return; }
  $('grid').innerHTML='';
  for(const it of items){
    const imgs=(it.images&&it.images.length)?it.images:(it.image?[it.image]:[]);
    const c=document.createElement('article'); c.className='card';
    const ph=document.createElement('div'); ph.className='ph';
    if(!imgs.length){ ph.classList.add('empty'); ph.textContent='🍇'; }
    else{
      const sl=document.createElement('div'); sl.className='slides';
      imgs.forEach((u,k)=>{if(isVid(u)){addVideo(sl,u,it.name+' video');return;} const im=document.createElement('img'); im.src=u; im.alt=it.name+(imgs.length>1?' photo '+(k+1):''); im.loading='lazy'; sl.appendChild(im);});
      ph.appendChild(sl);
      if(imgs.length>1){
        const dots=document.createElement('div'); dots.className='dots';
        imgs.forEach((_,k)=>{const i=document.createElement('i'); if(!k)i.className='on'; dots.appendChild(i);});
        const cnt=document.createElement('span'); cnt.className='cnt'; cnt.textContent='1/'+imgs.length;
        ph.append(dots,cnt);
        sl.addEventListener('scroll',()=>{const k=Math.round(sl.scrollLeft/sl.clientWidth);[...dots.children].forEach((x,j)=>x.className=j===k?'on':'');cnt.textContent=(k+1)+'/'+imgs.length;},{passive:true});
      }
    }
    const info=document.createElement('div'); info.className='info';
    const n=document.createElement('div'); n.className='name'; n.textContent=it.name;
    const p=document.createElement('div'); p.className='price'; p.textContent='₹'+it.price+' ';
    const u=document.createElement('small'); u.textContent='/ '+(it.unit||'kg'); p.appendChild(u);
    info.append(n,p);
    const l=link('Hello, I want to order '+it.name+' (₹'+it.price+'/'+(it.unit||'kg')+').');
    const ICON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>', OK='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    const acts=document.createElement('div'); acts.className='acts';
    if(l){ const a=document.createElement('a'); a.className='order'; a.href=l; a.textContent='Order this'; acts.appendChild(a); }
    const sh=document.createElement('button'); sh.type='button'; sh.className='share'; sh.innerHTML=ICON; sh.setAttribute('aria-label','Share '+it.name);
    sh.onclick=async()=>{
      const text='Kissan Cold Storage, Vijayapura, KA - Fresh Kishmish';
      const url=location.origin+'/';
      try{
        if(navigator.share){ await navigator.share({title:'Kissan Cold Storage',text,url}); }
        else{ await navigator.clipboard.writeText(text+'\n'+url); sh.innerHTML=OK; setTimeout(()=>sh.innerHTML=ICON,1500); }
      }catch(e){}
    };
    acts.appendChild(sh); info.appendChild(acts);
    c.append(ph,info); $('grid').appendChild(c);
  }
})();
</script>
</body>
</html>
